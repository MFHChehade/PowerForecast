[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerforecast"
version = "1.0.0"
description = "Benchmark of time-series foundation models vs tuned site models for data-center load forecasting"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mohamad Chehade", email = "chehade@utexas.edu" }]
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["powerforecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:X does not have valid feature names:UserWarning",
]
